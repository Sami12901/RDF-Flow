<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Container -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4FACFE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Waveform Cyber-Acoustic Gradient -->
    <linearGradient id="logoWaveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="35%" stop-color="#4FACFE"/>
      <stop offset="75%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38EF7D"/>
    </linearGradient>

    <!-- Text Typography Gradients -->
    <linearGradient id="textGradRdf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="textGradFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Container (160x160) -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="160" height="160" rx="36" fill="url(#logoBgGrad)" stroke="url(#logoBorderGrad)" stroke-width="3"/>
    
    <!-- Waveform bars -->
    <g filter="url(#logoGlow)">
      <rect x="26" y="65" width="13" height="34" rx="6.5" fill="url(#logoWaveGrad)"/>
      <rect x="47" y="42" width="13" height="80" rx="6.5" fill="url(#logoWaveGrad)"/>
      <rect x="68" y="27" width="13" height="110" rx="6.5" fill="url(#logoWaveGrad)"/>
      <rect x="89" y="36" width="13" height="92" rx="6.5" fill="url(#logoWaveGrad)"/>
      <rect x="110" y="55" width="13" height="54" rx="6.5" fill="url(#logoWaveGrad)"/>
      <rect x="131" y="72" width="13" height="22" rx="6.5" fill="url(#logoWaveGrad)"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(210, 110)">
    <!-- "RDF" Wordmark -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="68" fill="url(#textGradRdf)" letter-spacing="1">RDF</text>
    
    <!-- "FLOW" Wordmark -->
    <text x="145" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="68" fill="url(#textGradFlow)" letter-spacing="2">FLOW</text>

    <!-- Subtitle / Tagline -->
    <text x="5" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="16" fill="#94A3B8" letter-spacing="6">AI VOICE-TO-TEXT ENGINE</text>

    <!-- Status / Feature Capsule -->
    <rect x="375" y="-50" width="160" height="28" rx="14" fill="#0f172a" stroke="#00F2FE" stroke-width="1.5" opacity="0.9"/>
    <circle cx="390" cy="-36" r="4.5" fill="#38EF7D"/>
    <text x="403" y="-31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#38EF7D" letter-spacing="1.5">HYBRID AI v0.1</text>
  </g>
</svg>
