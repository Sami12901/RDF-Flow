<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="40%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Glowing Waves Gradient -->
    <linearGradient id="bannerWave" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="40%" stop-color="#4FACFE"/>
      <stop offset="80%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38EF7D"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7F00FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowHeavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowMid" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bannerBg)"/>

  <!-- Radial Cyber Grid Lines Background -->
  <g opacity="0.08" stroke="#00F2FE" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="210" r="160" fill="#00F2FE" opacity="0.12" filter="url(#glowHeavy)"/>
  <circle cx="1020" cy="180" r="140" fill="#7F00FF" opacity="0.1" filter="url(#glowHeavy)"/>

  <!-- Large Left Emblem (Squircle + Sound Waves) -->
  <g transform="translate(100, 100)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="220" height="220" rx="52" fill="#0b1120" stroke="#00F2FE" stroke-width="3.5" filter="url(#glowMid)"/>
    <rect x="6" y="6" width="208" height="208" rx="46" fill="none" stroke="#4FACFE" stroke-width="1" opacity="0.3"/>

    <!-- Waveform Bars inside Emblem -->
    <rect x="36" y="90" width="18" height="46" rx="9" fill="url(#bannerWave)"/>
    <rect x="64" y="58" width="18" height="110" rx="9" fill="url(#bannerWave)"/>
    <rect x="92" y="38" width="18" height="150" rx="9" fill="url(#bannerWave)"/>
    <rect x="120" y="50" width="18" height="126" rx="9" fill="url(#bannerWave)"/>
    <rect x="148" y="76" width="18" height="74" rx="9" fill="url(#bannerWave)"/>
    <rect x="176" y="98" width="18" height="30" rx="9" fill="url(#bannerWave)"/>
  </g>

  <!-- Typography Content -->
  <g transform="translate(370, 150)">
    <!-- Brand Title -->
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" letter-spacing="1">RDF <tspan fill="url(#bannerWave)">FLOW</tspan></text>

    <!-- Tagline -->
    <text x="5" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="24" fill="#E2E8F0">Next-Generation AI Voice-to-Text Everywhere You Type</text>

    <!-- Description -->
    <text x="5" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="400" font-size="16" fill="#94A3B8">Ultra-low latency dictation • Contextual AI rewriting • Multi-Provider &amp; Offline Whisper • Universal Desktop</text>

    <!-- Feature Pills -->
    <g transform="translate(5, 145)">
      <!-- Pill 1: Sub-300ms -->
      <rect x="0" y="0" width="155" height="32" rx="16" fill="#0f172a" stroke="#00F2FE" stroke-width="1.2"/>
      <text x="77" y="21" font-family="sans-serif" font-weight="700" font-size="12" fill="#00F2FE" text-anchor="middle">⚡ SUB-300MS SPEED</text>

      <!-- Pill 2: Hybrid AI -->
      <rect x="170" y="0" width="145" height="32" rx="16" fill="#0f172a" stroke="#38EF7D" stroke-width="1.2"/>
      <text x="242" y="21" font-family="sans-serif" font-weight="700" font-size="12" fill="#38EF7D" text-anchor="middle">🧠 HYBRID AI ENGINE</text>

      <!-- Pill 3: Cross Platform -->
      <rect x="330" y="0" width="175" height="32" rx="16" fill="#0f172a" stroke="#4FACFE" stroke-width="1.2"/>
      <text x="417" y="21" font-family="sans-serif" font-weight="700" font-size="12" fill="#4FACFE" text-anchor="middle">💻 WIN • MAC • LINUX</text>

      <!-- Pill 4: Privacy Offline -->
      <rect x="520" y="0" width="150" height="32" rx="16" fill="#0f172a" stroke="#7F00FF" stroke-width="1.2"/>
      <text x="595" y="21" font-family="sans-serif" font-weight="700" font-size="12" fill="#D8B4FE" text-anchor="middle">🔒 PRIVACY OFFLINE</text>
    </g>
  </g>
</svg>
