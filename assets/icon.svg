<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4FACFE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Waveform Cyber-Acoustic Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="30%" stop-color="#4FACFE"/>
      <stop offset="70%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38EF7D"/>
    </linearGradient>

    <!-- Secondary Waveform Gradient -->
    <linearGradient id="waveGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="#00F2FE" opacity="0.12" filter="url(#cyanGlow)" />

  <!-- Outer Rounded Squircle Base -->
  <rect x="40" y="40" width="432" height="432" rx="92" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Inner Subtle Inset Border -->
  <rect x="48" y="48" width="416" height="416" rx="84" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Waveform Equalizer Bars (Acoustic Flow Motif) -->
  <g filter="url(#subtleGlow)">
    <!-- Bar 1 (Leftmost - Initial voice trigger) -->
    <rect x="110" y="210" width="34" height="92" rx="17" fill="url(#waveGrad)"/>

    <!-- Bar 2 (Ascending power) -->
    <rect x="166" y="145" width="34" height="222" rx="17" fill="url(#waveGrad)"/>

    <!-- Bar 3 (Peak central resonance - R/F flow crest) -->
    <rect x="222" y="105" width="34" height="302" rx="17" fill="url(#waveGrad)"/>

    <!-- Bar 4 (Sustained intelligence) -->
    <rect x="278" y="130" width="34" height="252" rx="17" fill="url(#waveGrad)"/>

    <!-- Bar 5 (Harmonic stabilization) -->
    <rect x="334" y="180" width="34" height="152" rx="17" fill="url(#waveGrad)"/>

    <!-- Bar 6 (Rightmost finish) -->
    <rect x="390" y="225" width="34" height="62" rx="17" fill="url(#waveGrad)"/>
  </g>

  <!-- Dynamic Flow Horizontal Accent Dot Indicators -->
  <circle cx="239" cy="85" r="4" fill="#38EF7D" filter="url(#subtleGlow)"/>
  <circle cx="295" cy="110" r="4" fill="#00F2FE" filter="url(#subtleGlow)"/>
</svg>
