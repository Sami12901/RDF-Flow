name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'

    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Pillow
        run: pip install pillow

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Generate High-Resolution Branding & Icons
        run: python scripts/generate_icons.py

      - name: Run Synthetic Pipeline Test
        run: python scripts/synthetic_audio_test.py

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'RDF Flow ${{ github.ref_name || inputs.version }}'
          releaseBody: |
            ## RDF Flow ${{ github.ref_name || inputs.version }} — Official Release

            Next-Generation AI Voice-to-Text Everywhere You Type (Inspired by Wispr Flow).

            ### Highlights
            - ⚡ **Sub-250ms Hybrid STT**: Groq Whisper, Google Gemini, OpenAI, Deepgram, and Offline Whisper.
            - 🎙️ **Floating Waveform Pill**: Minimal translucent audio-reactive desktop overlay with live visualizer.
            - ✨ **Contextual AI Polishing**: Mode presets for Casual, Professional, Code/Technical, Bullets, and Raw speech.
            - ⌨️ **Active Window Injection**: Instant typing simulation into any focused application.
            - 🎨 **Cyber-Acoustic Branding**: Vector SVG, multi-res ICO, and high-res icon assets.

            ### Cross-Platform Assets Included
            - **Windows**: `.msi` Installer & Standalone `.exe`
            - **macOS**: Apple Silicon & Intel `.dmg` / `.app`
            - **Linux**: `.AppImage` & `.deb` Debian package
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
