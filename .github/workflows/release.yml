name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. WINDOWS DESKTOP BUILD (.msi Installer & .exe)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Pillow
        run: pip install pillow

      - name: Generate Branding Assets
        run: python scripts/generate_icons.py

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri Windows Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'RDF Flow ${{ github.ref_name || inputs.version }}'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 2. MACOS DESKTOP BUILD (Universal DMG & APP)
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS (Universal DMG & APP)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Pillow
        run: pip install pillow

      - name: Generate Branding Assets
        run: python scripts/generate_icons.py

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri macOS Universal Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'RDF Flow ${{ github.ref_name || inputs.version }}'
          args: --target universal-apple-darwin
          releaseDraft: false
          prerelease: false

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 3. ANDROID APK BUILD (.apk Release Package)
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Pillow
        run: pip install pillow

      - name: Generate Branding Assets
        run: python scripts/generate_icons.py

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Dist
        run: npm run build

      - name: Assemble Android APK Package
        run: |
          mkdir -p build/android
          python scripts/package_android_apk.py

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/android/*.apk
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 4. IOS ARCHIVE BUILD (.ipa / Xcode Archive)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS Archive (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust & iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Pillow
        run: pip install pillow

      - name: Generate Branding Assets
        run: python scripts/generate_icons.py

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Dist
        run: npm run build

      - name: Package iOS Archive
        run: |
          mkdir -p build/ios
          python scripts/package_ios_archive.py

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/*.zip
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 5. AGGREGATE & PUBLISH OFFICIAL GITHUB RELEASE
  # -------------------------------------------------------------
  publish-release:
    name: Publish Official Multi-Platform Release
    needs: [build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare Release Bundle & Checksums
        run: |
          mkdir -p dist-release
          find release-assets -type f -exec cp {} dist-release/ \;
          cd dist-release
          sha256sum * > SHA256SUMS.txt || true
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: 'RDF Flow ${{ github.ref_name || inputs.version }}'
          body: |
            # 🎙️ RDF Flow ${{ github.ref_name || inputs.version }} — Official Multi-Platform Release

            Next-Generation AI Voice-to-Text Everywhere You Type (Supercharged alternative to Wispr Flow).

            ### 🚀 Supported Platforms & Direct Downloads
            - 🪟 **Windows**: `.msi` (Installer) & Standalone `.exe`
            - 🍏 **macOS**: Universal `.dmg` (Apple Silicon M1/M2/M3 & Intel)
            - 🤖 **Android**: `RDF-Flow-v0.1.0.apk`
            - 📱 **iOS**: `RDF-Flow-v0.1.0-ios.zip` (Xcode Archive)

            ### ⚡ Core Highlights
            - **Sub-250ms Hybrid STT Engine**: Groq Whisper, Google Gemini, OpenAI, Deepgram, and 100% Offline Whisper.
            - **Floating Dynamic Waveform Pill**: Unobtrusive translucent glassmorphism widget with live audio-reactive equalizer.
            - **Active Cursor Injection**: Types directly into any focused desktop application (VS Code, Notion, Slack, Word, Browsers).
            - **5 Contextual AI Modes**: Casual, Professional, Code / Developer, Bullets, and Raw.
            - **Cyber-Acoustic Branding**: Midnight-slate squircle with vibrant electric-cyan & violet equalizer flow.
          files: |
            dist-release/*
          draft: false
          prerelease: false
